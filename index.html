<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#070809" />
<title>电梯公寓大逃杀 2</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <!-- 左上：时间 / 楼层 / 存活 -->
  <div id="hud">
    <div class="row1">
      <span id="clock">3:00</span>
      <span class="sep">/</span>
      <span id="floorNo">1F</span>
    </div>
    <div class="row2">
      <span class="tag">存活</span><b id="aliveNo">3</b>
      <span class="stam"><i id="staminaBar"></i></span>
    </div>
  </div>

  <div id="hint"></div>
  <div id="flashMsg"></div>

  <!-- 呼梯面板（靠近电梯才出现，鼠标按） -->
  <div id="callPanel" class="hidden">
    <div class="cpTitle">呼 梯</div>
    <div class="cpBtns">
      <button class="cpArrow" id="cpUp" aria-label="我要上楼">▲<span>上</span></button>
      <button class="cpArrow" id="cpDown" aria-label="我要下楼">▼<span>下</span></button>
    </div>
    <div class="cpReads">
      <div class="cpReadRow"><span class="cpName">C 梯</span><span class="cpRead" id="cpReadC">--</span></div>
      <div class="cpReadRow"><span class="cpName">D 梯</span><span class="cpRead" id="cpReadD">--</span></div>
    </div>
  </div>

  <!-- 楼梯面板：走到楼梯口才出现 -->
  <div id="stairPanel" class="hidden">
    <button class="stBtn" id="stUp" aria-label="上楼">▲<span>上楼</span></button>
    <button class="stBtn" id="stDown" aria-label="下楼">▼<span>下楼</span></button>
  </div>

  <!-- 轿厢内方向键：一个能"在电梯里挪动"的按钮组 -->
  <div id="carPad" class="hidden">
    <button class="cpad" data-cm="up" aria-label="往里走">▲</button>
    <button class="cpad" data-cm="left" aria-label="往左">◀</button>
    <button class="cpad" data-cm="right" aria-label="往右">▶</button>
    <button class="cpad" data-cm="down" aria-label="到门口">▼</button>
  </div>

  <!-- 轿厢面板：11 行 × 2 列，最后一行是开/关门图标 -->
  <div id="carPanel" class="hidden">
    <div id="carPanelTitle">C 梯 · 1F</div>
    <button id="carExit" class="carExit" aria-label="出梯" title="出梯">⇥</button>
    <div id="carFloors"></div>
  </div>

  <!-- 触屏 -->
  <div id="joy" class="touchonly"><i id="knob"></i></div>
  <div id="btns" class="touchonly">
    <button class="tb" data-act="sprint">跑</button>
    <button class="tb" data-act="interact">用</button>
    <button class="tb" data-act="up">上</button>
    <button class="tb" data-act="down">下</button>
  </div>
</div>

<!-- 死亡 / 结算 -->
<div id="overlay" class="hidden">
  <div id="overlayCard"></div>
</div>

<!-- 暂停 -->
<div id="pause" class="hidden">
  <div class="pauseCard">
    <div class="pauseTitle">暂 停</div>
    <div class="pauseKeys">
      <div><b>WASD</b> 移动 · <b>Shift</b> 跑</div>
      <div><b>E</b> 推门 / 呼梯 · 楼梯间里 <b>W/S</b> 上下楼</div>
      <div><b>F</b> 手电 · <b>M</b> 静音 · <b>Esc</b> 继续</div>
      <div>鼠标点地面走过去，点门推门</div>
    </div>
    <div class="pauseBtns">
      <button id="pauseResume" class="btn primary">继续</button>
      <button id="pauseRestart" class="btn">重新开始</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/geom.js"></script>
<script src="js/nav.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
